services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nex_guard
      POSTGRES_USER: nex_guard
      POSTGRES_PASSWORD: nex_guard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nex_guard -d nex_guard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://nex_guard:nex_guard@postgres:5432/nex_guard
      CORS_ORIGINS: http://localhost:8081,http://localhost:19006
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
